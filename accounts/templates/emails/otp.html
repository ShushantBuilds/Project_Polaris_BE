<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin: 0; padding: 0; background-color: #F9F9F6; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #1A1A1A;">
    <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="background-color: #F9F9F6; padding: 40px 20px;">
        <tr>
            <td align="center">
                <table role="presentation" width="100%" max-width="600" border="0" cellspacing="0" cellpadding="0" style="background-color: #FFFFFF; max-width: 600px; width: 100%; border-radius: 12px; border: 1px solid #E5E5DF; overflow: hidden;">
                    <!-- Header -->
                    <tr>
                        <td style="padding: 40px 40px 20px 40px; text-align: center;">
                            <h1 style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.5px; color: #1A1A1A;">
                                Polaris
                            </h1>
                        </td>
                    </tr>
                    <!-- Body -->
                    <tr>
                        <td style="padding: 0 40px 20px 40px; text-align: center;">
                            <h2 style="margin: 0 0 16px 0; font-size: 18px; font-weight: 500; color: #8B8070;">{{ title }}</h2>
                            <p style="margin: 0 0 32px 0; font-size: 15px; line-height: 24px; color: #4A4A4A;">
                                {{ message }}
                            </p>
                            <!-- OTP Box -->
                            <div style="background-color: #F5F5F0; border: 1px dashed #B8B0A5; border-radius: 8px; padding: 24px; margin-bottom: 32px;">
                                <span style="font-family: monospace; font-size: 32px; font-weight: 600; letter-spacing: 8px; color: #1A1A1A;">
                                    {{ code }}
                                </span>
                            </div>
                            <p style="margin: 0; font-size: 13px; color: #8B8070;">
                                If you didn't request this code, you can safely ignore this email.
                            </p>
                        </td>
                    </tr>
                </table>
                <!-- Footer -->
                <table role="presentation" width="100%" max-width="600" border="0" cellspacing="0" cellpadding="0" style="max-width: 600px; width: 100%;">
                    <tr>
                        <td style="padding: 24px 0; text-align: center;">
                            <p style="margin: 0; font-size: 12px; color: #A39B90;">
                                © 2026 Polaris Discovery Engine. All rights reserved.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
