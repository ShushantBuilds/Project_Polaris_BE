<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin: 0; padding: 0; background-color: #F9F9F6; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #1A1A1A;">
    <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="background-color: #F9F9F6; padding: 40px 20px;">
        <tr>
            <td align="center">
                <table role="presentation" width="100%" max-width="600" border="0" cellspacing="0" cellpadding="0" style="background-color: #FFFFFF; max-width: 600px; width: 100%; border-radius: 12px; border: 1px solid #E5E5DF; overflow: hidden;">
                    <tr>
                        <td style="padding: 40px; text-align: center;">
                            <div style="margin-bottom: 24px;">
                                <!-- Alert Icon -->
                                <span style="font-size: 32px;">🛡️</span>
                            </div>
                            <h2 style="margin: 0 0 16px 0; font-size: 20px; font-weight: 600; color: #1A1A1A;">
                                {{ title }}
                            </h2>
                            <p style="margin: 0 0 32px 0; font-size: 15px; line-height: 24px; color: #4A4A4A;">
                                {{ message }}
                            </p>
                            <hr style="border: none; border-top: 1px solid #E5E5DF; margin: 32px 0;">
                            <p style="margin: 0; font-size: 13px; color: #8B8070; line-height: 20px;">
                                This is an automated security notification from Polaris.<br>
                                Do not reply to this email.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
